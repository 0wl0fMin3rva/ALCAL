name: Deploy sync server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-sync-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.ALCAL_SYNC_KEY != '' }}
    steps:
      - name: Check secrets
        if: env.READY != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ALCAL_SYNC_KEY as repository secrets, then run this workflow again (see SETUP-SYNC.md)."
      - uses: actions/checkout@v4
        if: env.READY == 'true'
      - name: Deploy to Cloudflare
        if: env.READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          wranglerVersion: "4"
          secrets: |
            SYNC_KEY
        env:
          SYNC_KEY: ${{ secrets.ALCAL_SYNC_KEY }}
